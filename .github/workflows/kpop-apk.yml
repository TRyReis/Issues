name: K-Pop Radar APK

on:
  push:
    paths:
      - 'kpop-releases/**'
      - '.github/workflows/kpop-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

# Builds nacheinander ausführen, damit sich das Hochladen der APK nicht überschneidet
concurrency:
  group: kpop-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Optional: fester Schlüssel aus Secrets (KS_BASE64, KS_PASSWORD, KS_ALIAS),
      # damit Updates ohne Deinstallation möglich sind.
      - name: Keystore aus Secrets
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
        if: env.KS_BASE64 != ''
        run: echo "$KS_BASE64" | base64 -d > kpop-releases/android/app/release.keystore

      - name: APK bauen
        working-directory: kpop-releases/android
        env:
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
          # Ticketmaster-Key aus dem Repository-Secret TM_API_KEY (wird verschleiert in die App eingebaut)
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp kpop-releases/android/app/build/outputs/apk/release/app-release.apk KPop-Release-Radar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KPop-Release-Radar
          path: KPop-Release-Radar.apk

      - name: Als Release veröffentlichen
        id: release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kpop-radar-latest
          target_commitish: ${{ github.sha }}
          name: K-Pop Release Radar (Android-APK)
          body: |
            Neueste Version der K-Pop Release Radar App.
            **KPop-Release-Radar.apk** auf dem Handy herunterladen und öffnen
            (ggf. „Installation aus unbekannten Quellen“ erlauben).
          files: KPop-Release-Radar.apk
          overwrite_files: true

      # GitHub lehnt das Ersetzen der Datei gelegentlich kurz ab → einmal nach Pause wiederholen
      - name: Kurz warten (nur bei Fehler)
        if: steps.release.outcome == 'failure'
        run: sleep 30

      - name: Als Release veröffentlichen (2. Versuch)
        if: steps.release.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kpop-radar-latest
          target_commitish: ${{ github.sha }}
          name: K-Pop Release Radar (Android-APK)
          body: |
            Neueste Version der K-Pop Release Radar App.
            **KPop-Release-Radar.apk** auf dem Handy herunterladen und öffnen
            (ggf. „Installation aus unbekannten Quellen“ erlauben).
          files: KPop-Release-Radar.apk
          overwrite_files: true
